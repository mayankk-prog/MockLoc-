name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: MockLoc-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release (direct APK download)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MockLoc.apk
          gh release create "build-${{ github.run_number }}" MockLoc.apk \
            --target "$GITHUB_SHA" \
            --title "Mock Loc build ${{ github.run_number }}" \
            --notes "Signed debug build. Install over the previous version." \
            --latest
